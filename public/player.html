<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #111; color: #eee; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

    /* Join screen */
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 16px;
    }
    #join-screen h1 { font-size: 1.6rem; }
    #join-screen input {
      padding: 10px 16px;
      font-family: monospace;
      font-size: 1rem;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #eee;
      border-radius: 6px;
      width: 240px;
      text-align: center;
    }
    #join-screen button {
      padding: 10px 28px;
      font-family: monospace;
      font-size: 1rem;
      background: #2a2a2a;
      border: 1px solid #555;
      color: #eee;
      border-radius: 6px;
      cursor: pointer;
    }
    #join-screen button:hover { background: #333; }

    /* Game screen */
    #game-screen { display: none; flex: 1; flex-direction: column; }

    #module-frame {
      flex: 1;
      border: none;
      width: 100%;
    }

    #player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: #1a1a1a;
      border-top: 1px solid #222;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>

  <div id="join-screen">
    <h1>Join Game</h1>
    <input id="name-input" type="text" placeholder="Enter your name" maxlength="20" />
    <button id="join-btn">Join</button>
  </div>

  <div id="game-screen">
    <iframe id="module-frame" src="/modules/waiting.html"></iframe>
    <div id="player-bar">
      <span id="player-name-display"></span>
      <span id="connection-status">connected</span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const joinScreen = document.getElementById('join-screen');
    const gameScreen = document.getElementById('game-screen');
    const nameInput = document.getElementById('name-input');
    const joinBtn = document.getElementById('join-btn');
    const moduleFrame = document.getElementById('module-frame');
    const playerNameDisplay = document.getElementById('player-name-display');
    const connectionStatus = document.getElementById('connection-status');

    let playerName = null;

    function join() {
      const name = nameInput.value.trim();
      if (!name) return;
      playerName = name;
      socket.emit('player:join', name);
      playerNameDisplay.textContent = name;
      joinScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
    }

    joinBtn.addEventListener('click', join);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });

    // Some modules have a different view for players vs display screens
    const PLAYER_ROUTES = {
      'arena':   'arena-player',
      'dungeon': 'dungeon-player',  // legacy
      'pvp':     'pvp-player',      // legacy
    };

    socket.on('player:load-module', (moduleName) => {
      const route = PLAYER_ROUTES[moduleName] || moduleName;
      const nameParam = playerName ? `?name=${encodeURIComponent(playerName)}` : '';
      moduleFrame.src = `/modules/${route}.html${nameParam}`;
    });

    socket.on('connect', () => {
      connectionStatus.textContent = 'connected';
      // Re-join after reconnect if we already had a name
      if (playerName) {
        socket.emit('player:join', playerName);
      }
    });

    socket.on('disconnect', () => {
      connectionStatus.textContent = 'reconnecting...';
    });
  </script>
</body>
</html>
