<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Host Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      background: #111;
      color: #eee;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Left panel ── */
    #left-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      min-width: 0;
    }

    h1 { font-size: 1.4rem; margin-bottom: 16px; color: #fff; }

    #status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-bottom: 24px;
    }
    #status.connected    { background: #1a3a1a; color: #4caf50; }
    #status.disconnected { background: #3a1a1a; color: #f44336; }

    .section { margin-bottom: 28px; }
    .section h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #555;
      margin-bottom: 10px;
    }

    /* Players list */
    #players { list-style: none; }
    #players li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: #1e1e1e;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }
    #players li .player-name { flex: 1; }
    #players li .player-name::before { content: "● "; color: #4caf50; }
    #no-players { color: #444; font-size: 0.85rem; }

    #send-all-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #1e1e1e;
    }

    .minigame-select {
      background: #2a2a2a;
      border: 1px solid #383838;
      color: #ccc;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .send-btn {
      padding: 4px 10px;
      background: #2a1e3a;
      border: 1px solid #4a3a6a;
      color: #b39ddb;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: nowrap;
      transition: background 0.1s;
    }
    .send-btn:hover { background: #3a2a4a; }

    /* Module buttons */
    .module-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .module-btn, .display-btn {
      padding: 10px 18px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      color: #ccc;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.9rem;
      transition: background 0.12s, border-color 0.12s;
    }
    .module-btn:hover, .display-btn:hover { background: #262626; border-color: #444; }
    .module-btn.active  { border-color: #4caf50; color: #4caf50; background: #1a2e1a; }
    .display-btn.active { border-color: #4a9de0; color: #4a9de0; background: #1a2a3a; }

    .active-line { font-size: 0.85rem; color: #555; margin-bottom: 10px; }
    .active-line span { color: #aaa; }

    /* Dungeon settings */
    .dungeon-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .dungeon-row label { font-size: 0.85rem; color: #555; }
    .dungeon-row input {
      width: 56px;
      padding: 5px 8px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 4px;
      color: #eee;
      font-family: monospace;
      font-size: 0.85rem;
      text-align: center;
    }
    .dungeon-row input:focus { outline: none; border-color: #444; }
    .dungeon-set-btn {
      padding: 5px 14px;
      background: #1e2a3a;
      border: 1px solid #2a4a6a;
      color: #4a9de0;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.82rem;
      transition: background 0.12s;
    }
    .dungeon-set-btn:hover { background: #243444; }
    #dungeon-size-label { font-size: 0.78rem; color: #444; }

    .toggle-btn {
      padding: 5px 14px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      color: #555;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.82rem;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .toggle-btn:hover { background: #262626; }
    .toggle-btn.on {
      background: #1a2e1a;
      border-color: #2a4a2a;
      color: #4caf7d;
    }

    .display-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.78rem;
      color: #4a9de0;
      text-decoration: none;
      border: 1px solid #2a4a6a;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .display-link:hover { background: #1e2a3a; }

    /* ── Right panel (Activity Log) ── */
    #right-panel {
      width: 420px;
      flex-shrink: 0;
      background: #0d0d0d;
      border-left: 1px solid #1e1e1e;
      display: flex;
      flex-direction: column;
    }

    #log-header {
      padding: 14px 16px 10px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #444;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }

    #activity-log {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
    }

    .log-entry {
      display: flex;
      gap: 8px;
      padding: 5px 14px;
      font-size: 0.78rem;
      line-height: 1.4;
      border-bottom: 1px solid #131313;
    }
    .log-time { color: #333; white-space: nowrap; flex-shrink: 0; }
    .log-msg  { word-break: break-word; }

    .log-entry.info        .log-msg { color: #555; }
    .log-entry.action      .log-msg { color: #4a9de0; }
    .log-entry.minigame    .log-msg { color: #f59e42; }
    .log-entry.result-good .log-msg { color: #4caf7d; }
    .log-entry.result-bad  .log-msg { color: #e96a6a; }

    #activity-log::-webkit-scrollbar { width: 3px; }
    #activity-log::-webkit-scrollbar-thumb { background: #222; }
  </style>
</head>
<body>

  <!-- Left panel -->
  <div id="left-panel">
    <h1>Host</h1>
    <div id="status" class="disconnected">disconnected</div>

    <div class="section">
      <h2>Players</h2>
      <ul id="players"></ul>
      <div id="no-players">No players connected.</div>
      <div id="send-all-row">
        <select id="send-all-select" class="minigame-select"></select>
        <button id="send-all-btn" class="send-btn">Send to All ↑</button>
      </div>
    </div>

    <div class="section">
      <h2>Push Module</h2>
      <div class="active-line">Active: <span id="current-module-name">—</span></div>
      <div class="module-grid" id="module-grid"></div>
      <a class="display-link" href="/display.html" target="_blank">Open Display ↗</a>
    </div>

    <div class="section" id="arena-section" style="display:none">
      <h2>Arena Settings</h2>

      <!-- Row 1: Shape + size + rule toggles -->
      <div class="dungeon-row" style="margin-bottom:8px;">
        <button class="toggle-btn on" id="a-shape-rect">Rect</button>
        <button class="toggle-btn"    id="a-shape-circle">Circle</button>
        <span id="a-size-wrap" style="display:flex;align-items:center;gap:6px;">
          <label>W</label>
          <input id="arena-w" type="number" min="2" max="30" value="10" style="width:46px;padding:5px 6px;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:4px;color:#eee;font-family:monospace;font-size:0.82rem;text-align:center;" />
          <label>H</label>
          <input id="arena-h" type="number" min="2" max="30" value="8"  style="width:46px;padding:5px 6px;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:4px;color:#eee;font-family:monospace;font-size:0.82rem;text-align:center;" />
          <button class="dungeon-set-btn" id="arena-size-btn">Set</button>
        </span>
        <button class="toggle-btn" id="a-pvp-btn">PvP: OFF</button>
        <button class="toggle-btn on" id="a-enemy-btn">Enemy: ON</button>
      </div>

      <!-- Row 2: Mode buttons + timer options -->
      <div class="dungeon-row" style="margin-bottom:8px;">
        <button class="toggle-btn on" id="a-mode-freeze">Freeze</button>
        <button class="toggle-btn"    id="a-mode-free">Free</button>
        <button class="toggle-btn"    id="a-mode-turn">Turns</button>
        <button class="toggle-btn"    id="a-mode-clock">Clock</button>
        <span id="a-turn-timer-wrap" style="display:none;align-items:center;gap:6px;">
          <button class="toggle-btn" id="arena-timer-btn">Timer: OFF</button>
          <input id="arena-timer-secs" type="number" min="3" max="120" value="8" style="width:46px;padding:5px 6px;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:4px;color:#eee;font-family:monospace;font-size:0.82rem;text-align:center;" />
          <button class="dungeon-set-btn" id="arena-timer-set-btn">Set</button>
        </span>
        <span id="a-clock-timer-wrap" style="display:none;align-items:center;gap:6px;">
          <label style="font-size:0.78rem;color:#555;">secs</label>
          <input id="arena-clock-secs" type="number" min="3" max="120" value="5" style="width:46px;padding:5px 6px;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:4px;color:#eee;font-family:monospace;font-size:0.82rem;text-align:center;" />
          <button class="dungeon-set-btn" id="arena-clock-set-btn">Set</button>
        </span>
      </div>

      <!-- Row 3: Level loader + reset -->
      <div class="dungeon-row">
        <label style="font-size:0.78rem;color:#555;">Level</label>
        <select id="arena-level-select" class="minigame-select">
          <option value="">— select —</option>
        </select>
        <button class="dungeon-set-btn" id="arena-load-btn">Load</button>
        <button id="arena-reset-btn" style="padding:5px 14px;background:#3a1a1a;border:1px solid #6a2a2a;color:#e96a6a;border-radius:4px;cursor:pointer;font-family:monospace;font-size:0.82rem;">Reset ↺</button>
      </div>
    </div>
  </div>

  <!-- Right panel: Activity Log -->
  <div id="right-panel">
    <div id="log-header">Activity Log</div>
    <div id="activity-log"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const MODULES = [
      { id: 'waiting',  label: 'Waiting' },
      { id: 'chat',     label: 'Chat' },
      { id: 'arena',    label: 'Arena' },
      { id: 'module-a', label: 'Module A' },
      { id: 'module-b', label: 'Module B' },
    ];

    const MINIGAMES = [
      { id: 'minigame-reflex',   label: 'Reflex Test' },
      { id: 'minigame-reflex-2', label: 'Reflex Test Lv.2' },
      { id: 'minigame-reflex-3', label: 'Reflex Test Lv.3' },
    ];

    const socket = io();

    const statusEl        = document.getElementById('status');
    const playersEl       = document.getElementById('players');
    const noPlayersEl     = document.getElementById('no-players');
    const currentModuleEl = document.getElementById('current-module-name');
    const moduleGrid      = document.getElementById('module-grid');
    const activityLog     = document.getElementById('activity-log');

    // Build module buttons
    MODULES.forEach(({ id, label }) => {
      const btn = document.createElement('button');
      btn.className = 'module-btn';
      btn.dataset.moduleId = id;
      btn.textContent = label;
      btn.addEventListener('click', () => socket.emit('host:push', id));
      moduleGrid.appendChild(btn);
    });

    // Populate send-all dropdown and wire button
    const sendAllSelect = document.getElementById('send-all-select');
    const sendAllBtn    = document.getElementById('send-all-btn');
    MINIGAMES.forEach(({ id, label }) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = label;
      sendAllSelect.appendChild(opt);
    });
    sendAllBtn.addEventListener('click', () => {
      socket.emit('host:send-minigame-all', { minigame: sendAllSelect.value });
    });

    // ── Arena controls ────────────────────────────────────────────────
    const aModeBtns = {
      freeze: document.getElementById('a-mode-freeze'),
      free:   document.getElementById('a-mode-free'),
      turn:   document.getElementById('a-mode-turn'),
      clock:  document.getElementById('a-mode-clock'),
    };
    const aShapeBtns   = { rect: document.getElementById('a-shape-rect'), circle: document.getElementById('a-shape-circle') };
    const aSizeWrap    = document.getElementById('a-size-wrap');
    const arenaWInput  = document.getElementById('arena-w');
    const arenaHInput  = document.getElementById('arena-h');
    const aSizeBtn     = document.getElementById('arena-size-btn');
    const aPvpBtn      = document.getElementById('a-pvp-btn');
    const aEnemyBtn    = document.getElementById('a-enemy-btn');
    const aTimerBtn    = document.getElementById('arena-timer-btn');
    const aTimerSecs   = document.getElementById('arena-timer-secs');
    const aTimerSetBtn = document.getElementById('arena-timer-set-btn');
    const aClockSecs   = document.getElementById('arena-clock-secs');
    const aClockSetBtn = document.getElementById('arena-clock-set-btn');
    const aTurnWrap    = document.getElementById('a-turn-timer-wrap');
    const aClockWrap   = document.getElementById('a-clock-timer-wrap');
    const aLevelSelect = document.getElementById('arena-level-select');
    const aLoadBtn     = document.getElementById('arena-load-btn');

    // Shape
    Object.entries(aShapeBtns).forEach(([shape, btn]) => {
      btn.addEventListener('click', () => {
        socket.emit('host:arena-config', { shape });
      });
    });

    // Size (only applies to rect)
    aSizeBtn.addEventListener('click', () => {
      const w = parseInt(arenaWInput.value, 10), h = parseInt(arenaHInput.value, 10);
      if (!isNaN(w) && !isNaN(h)) socket.emit('host:arena-config', { width: w, height: h });
    });

    // PvP / Enemy toggles (optimistic UI, confirmed by server state)
    let arenaIsPvp = false, arenaHasEnemy = true;
    aPvpBtn.addEventListener('click', () => {
      arenaIsPvp = !arenaIsPvp;
      socket.emit('host:arena-config', { pvp: arenaIsPvp });
    });
    aEnemyBtn.addEventListener('click', () => {
      arenaHasEnemy = !arenaHasEnemy;
      socket.emit('host:arena-config', { hasEnemy: arenaHasEnemy });
    });

    // Mode buttons
    Object.entries(aModeBtns).forEach(([mode, btn]) => {
      btn.addEventListener('click', () => socket.emit('host:arena-mode', mode));
    });

    // Turn timer
    aTimerBtn.addEventListener('click', () => socket.emit('host:arena-timer-toggle'));
    aTimerSetBtn.addEventListener('click', () => {
      const v = parseInt(aTimerSecs.value, 10);
      if (!isNaN(v)) socket.emit('host:arena-timer-set', { turnSecs: v });
    });
    aClockSetBtn.addEventListener('click', () => {
      const v = parseInt(aClockSecs.value, 10);
      if (!isNaN(v)) socket.emit('host:arena-timer-set', { clockSecs: v });
    });

    // Level loader
    fetch('/api/levels').then(r => r.json()).then(levels => {
      levels.forEach(({ id, name }) => {
        const opt = document.createElement('option');
        opt.value = id; opt.textContent = name;
        aLevelSelect.appendChild(opt);
      });
    });
    aLoadBtn.addEventListener('click', () => {
      if (aLevelSelect.value) socket.emit('host:arena-load-level', aLevelSelect.value);
    });

    // Reset
    document.getElementById('arena-reset-btn').addEventListener('click', () => socket.emit('host:arena-reset'));

    // Sync UI from server state
    socket.on('arena:state', ({ shape, width, height, pvp, hasEnemy, mode, timerEnabled, timerSeconds, clockSeconds }) => {
      // Shape buttons
      Object.entries(aShapeBtns).forEach(([s, btn]) => btn.classList.toggle('on', s === shape));
      aSizeWrap.style.display = shape === 'rect' ? 'flex' : 'none';
      if (width  != null) arenaWInput.value = width;
      if (height != null) arenaHInput.value = height;

      // PvP / Enemy
      arenaIsPvp    = pvp;
      arenaHasEnemy = hasEnemy;
      aPvpBtn.textContent = `PvP: ${pvp ? 'ON' : 'OFF'}`;
      aPvpBtn.classList.toggle('on', pvp);
      aEnemyBtn.textContent = `Enemy: ${hasEnemy ? 'ON' : 'OFF'}`;
      aEnemyBtn.classList.toggle('on', hasEnemy);

      // Mode buttons
      Object.entries(aModeBtns).forEach(([m, btn]) => btn.classList.toggle('on', m === mode));
      aTurnWrap.style.display  = mode === 'turn'  ? 'flex' : 'none';
      aClockWrap.style.display = mode === 'clock' ? 'flex' : 'none';

      // Timer
      aTimerBtn.textContent = `Timer: ${timerEnabled ? 'ON' : 'OFF'}`;
      aTimerBtn.classList.toggle('on', timerEnabled);
      if (timerSeconds != null) aTimerSecs.value = timerSeconds;
      if (clockSeconds != null) aClockSecs.value = clockSeconds;
    });

    const CLASSES = [
      { id: 'barbarian', label: 'Barbarian', color: '#e96a6a' },
      { id: 'wizard',    label: 'Wizard',    color: '#4a9de0' },
      { id: 'healer',    label: 'Healer',    color: '#f5d442' },
    ];

    // ── Player list with send-minigame ──
    function buildPlayerList(players) {
      playersEl.innerHTML = '';
      if (players.length === 0) {
        noPlayersEl.style.display = 'block';
        return;
      }
      noPlayersEl.style.display = 'none';
      players.forEach(({ name, socketId, playerClass }) => {
        const li = document.createElement('li');

        const nameEl = document.createElement('span');
        nameEl.className = 'player-name';
        nameEl.textContent = name;

        const classSel = document.createElement('select');
        classSel.className = 'minigame-select';
        CLASSES.forEach(({ id, label }) => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = label;
          if (id === (playerClass || 'barbarian')) opt.selected = true;
          classSel.appendChild(opt);
        });
        classSel.addEventListener('change', () => {
          socket.emit('host:set-class', { socketId, playerClass: classSel.value });
          const cls = CLASSES.find(c => c.id === classSel.value);
          if (cls) classSel.style.color = cls.color;
        });
        // Set initial color
        const initCls = CLASSES.find(c => c.id === (playerClass || 'barbarian'));
        if (initCls) classSel.style.color = initCls.color;

        const minigameSel = document.createElement('select');
        minigameSel.className = 'minigame-select';
        MINIGAMES.forEach(({ id, label }) => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = label;
          minigameSel.appendChild(opt);
        });

        const sendBtn = document.createElement('button');
        sendBtn.className = 'send-btn';
        sendBtn.textContent = 'Send ↑';
        sendBtn.addEventListener('click', () => {
          socket.emit('host:send-minigame', { socketId, minigame: minigameSel.value });
        });

        li.appendChild(nameEl);
        li.appendChild(classSel);
        li.appendChild(minigameSel);
        li.appendChild(sendBtn);
        playersEl.appendChild(li);
      });
    }

    // ── Activity log ──
    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function renderLog(entries) {
      activityLog.innerHTML = '';
      entries.forEach(({ ts, message, type }) => {
        const row = document.createElement('div');
        row.className = `log-entry ${type}`;

        const timeEl = document.createElement('span');
        timeEl.className = 'log-time';
        timeEl.textContent = formatTime(ts);

        const msgEl = document.createElement('span');
        msgEl.className = 'log-msg';
        msgEl.textContent = message;

        row.appendChild(timeEl);
        row.appendChild(msgEl);
        activityLog.appendChild(row);
      });
      activityLog.scrollTop = activityLog.scrollHeight;
    }

    // ── Socket events ──
    socket.on('connect', () => {
      statusEl.textContent = 'connected';
      statusEl.className = 'connected';
      socket.emit('host:request-state');
    });

    socket.on('disconnect', () => {
      statusEl.textContent = 'disconnected';
      statusEl.className = 'disconnected';
    });

    socket.on('host:state-update', ({ players, currentModule }) => {
      buildPlayerList(players);
      currentModuleEl.textContent = currentModule;
      document.querySelectorAll('.module-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.moduleId === currentModule);
      });
      document.getElementById('arena-section').style.display = currentModule === 'arena' ? '' : 'none';
    });

    socket.on('host:log-update', (entries) => {
      renderLog(entries);
    });
  </script>
</body>
</html>
