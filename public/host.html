<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Host Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      background: #111;
      color: #eee;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Left panel ── */
    #left-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      min-width: 0;
    }

    h1 { font-size: 1.4rem; margin-bottom: 16px; color: #fff; }

    #status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-bottom: 24px;
    }
    #status.connected    { background: #1a3a1a; color: #4caf50; }
    #status.disconnected { background: #3a1a1a; color: #f44336; }

    .section { margin-bottom: 28px; }
    .section h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #555;
      margin-bottom: 10px;
    }

    /* Players list */
    #players { list-style: none; }
    #players li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: #1e1e1e;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }
    #players li .player-name { flex: 1; }
    #players li .player-name::before { content: "● "; color: #4caf50; }
    #no-players { color: #444; font-size: 0.85rem; }

    #send-all-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #1e1e1e;
    }

    .minigame-select {
      background: #2a2a2a;
      border: 1px solid #383838;
      color: #ccc;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .send-btn {
      padding: 4px 10px;
      background: #2a1e3a;
      border: 1px solid #4a3a6a;
      color: #b39ddb;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: nowrap;
      transition: background 0.1s;
    }
    .send-btn:hover { background: #3a2a4a; }

    /* Module buttons */
    .module-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .module-btn, .display-btn {
      padding: 10px 18px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      color: #ccc;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.9rem;
      transition: background 0.12s, border-color 0.12s;
    }
    .module-btn:hover, .display-btn:hover { background: #262626; border-color: #444; }
    .module-btn.active  { border-color: #4caf50; color: #4caf50; background: #1a2e1a; }
    .display-btn.active { border-color: #4a9de0; color: #4a9de0; background: #1a2a3a; }

    .active-line { font-size: 0.85rem; color: #555; margin-bottom: 10px; }
    .active-line span { color: #aaa; }

    /* Dungeon settings */
    .dungeon-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .dungeon-row label { font-size: 0.85rem; color: #555; }
    .dungeon-row input {
      width: 56px;
      padding: 5px 8px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 4px;
      color: #eee;
      font-family: monospace;
      font-size: 0.85rem;
      text-align: center;
    }
    .dungeon-row input:focus { outline: none; border-color: #444; }
    .dungeon-set-btn {
      padding: 5px 14px;
      background: #1e2a3a;
      border: 1px solid #2a4a6a;
      color: #4a9de0;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.82rem;
      transition: background 0.12s;
    }
    .dungeon-set-btn:hover { background: #243444; }
    #dungeon-size-label { font-size: 0.78rem; color: #444; }

    .toggle-btn {
      padding: 5px 14px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      color: #555;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.82rem;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .toggle-btn:hover { background: #262626; }
    .toggle-btn.on {
      background: #1a2e1a;
      border-color: #2a4a2a;
      color: #4caf7d;
    }

    .display-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.78rem;
      color: #4a9de0;
      text-decoration: none;
      border: 1px solid #2a4a6a;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .display-link:hover { background: #1e2a3a; }

    /* ── Right panel (Activity Log) ── */
    #right-panel {
      width: 420px;
      flex-shrink: 0;
      background: #0d0d0d;
      border-left: 1px solid #1e1e1e;
      display: flex;
      flex-direction: column;
    }

    #log-header {
      padding: 14px 16px 10px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #444;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }

    #activity-log {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
    }

    .log-entry {
      display: flex;
      gap: 8px;
      padding: 5px 14px;
      font-size: 0.78rem;
      line-height: 1.4;
      border-bottom: 1px solid #131313;
    }
    .log-time { color: #333; white-space: nowrap; flex-shrink: 0; }
    .log-msg  { word-break: break-word; }

    .log-entry.info        .log-msg { color: #555; }
    .log-entry.action      .log-msg { color: #4a9de0; }
    .log-entry.minigame    .log-msg { color: #f59e42; }
    .log-entry.result-good .log-msg { color: #4caf7d; }
    .log-entry.result-bad  .log-msg { color: #e96a6a; }

    #activity-log::-webkit-scrollbar { width: 3px; }
    #activity-log::-webkit-scrollbar-thumb { background: #222; }
  </style>
</head>
<body>

  <!-- Left panel -->
  <div id="left-panel">
    <h1>Host</h1>
    <div id="status" class="disconnected">disconnected</div>

    <div class="section">
      <h2>Players</h2>
      <ul id="players"></ul>
      <div id="no-players">No players connected.</div>
      <div id="send-all-row">
        <select id="send-all-select" class="minigame-select"></select>
        <button id="send-all-btn" class="send-btn">Send to All ↑</button>
      </div>
    </div>

    <div class="section">
      <h2>Push Module</h2>
      <div class="active-line">Active: <span id="current-module-name">—</span></div>
      <div class="module-grid" id="module-grid"></div>
      <a class="display-link" href="/display.html" target="_blank">Open Display ↗</a>
    </div>

    <div class="section" id="dungeon-section" style="display:none">
      <h2>Dungeon Settings</h2>
      <div class="dungeon-row">
        <label>W</label>
        <input id="dungeon-w" type="number" min="2" max="30" value="10" />
        <label>H</label>
        <input id="dungeon-h" type="number" min="2" max="30" value="8" />
        <button class="dungeon-set-btn" id="dungeon-set-btn">Set</button>
        <span id="dungeon-size-label"></span>
        <button class="toggle-btn" id="d-mode-free">Free</button>
        <button class="toggle-btn on" id="d-mode-turn">Turns</button>
        <button class="toggle-btn" id="d-mode-clock">Clock</button>
        <span id="d-turn-timer-wrap" style="display:flex;align-items:center;gap:6px;">
          <button class="toggle-btn" id="dungeon-timer-btn">Timer: OFF</button>
          <input id="dungeon-timer-secs" type="number" min="3" max="120" value="8" style="width:46px;padding:5px 6px;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:4px;color:#eee;font-family:monospace;font-size:0.82rem;text-align:center;" />
          <button class="dungeon-set-btn" id="dungeon-timer-set-btn">Set</button>
        </span>
        <span id="d-clock-timer-wrap" style="display:none;align-items:center;gap:6px;">
          <label style="font-size:0.78rem;color:#555;">Clock secs</label>
          <input id="dungeon-clock-secs" type="number" min="3" max="120" value="5" style="width:46px;padding:5px 6px;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:4px;color:#eee;font-family:monospace;font-size:0.82rem;text-align:center;" />
          <button class="dungeon-set-btn" id="dungeon-clock-set-btn">Set</button>
        </span>
        <button id="dungeon-reset-btn" style="padding:5px 14px;background:#3a1a1a;border:1px solid #6a2a2a;color:#e96a6a;border-radius:4px;cursor:pointer;font-family:monospace;font-size:0.82rem;">Reset ↺</button>
      </div>
    </div>

    <div class="section" id="pvp-section" style="display:none">
      <h2>PvP Settings</h2>
      <div class="dungeon-row">
        <button class="toggle-btn" id="p-mode-free">Free</button>
        <button class="toggle-btn on" id="p-mode-turn">Turns</button>
        <button class="toggle-btn" id="p-mode-clock">Clock</button>
        <span id="p-turn-timer-wrap" style="display:flex;align-items:center;gap:6px;">
          <button class="toggle-btn" id="pvp-timer-btn">Timer: OFF</button>
          <input id="pvp-timer-secs" type="number" min="3" max="120" value="8" style="width:46px;padding:5px 6px;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:4px;color:#eee;font-family:monospace;font-size:0.82rem;text-align:center;" />
          <button class="dungeon-set-btn" id="pvp-timer-set-btn">Set</button>
        </span>
        <span id="p-clock-timer-wrap" style="display:none;align-items:center;gap:6px;">
          <label style="font-size:0.78rem;color:#555;">Clock secs</label>
          <input id="pvp-clock-secs" type="number" min="3" max="120" value="5" style="width:46px;padding:5px 6px;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:4px;color:#eee;font-family:monospace;font-size:0.82rem;text-align:center;" />
          <button class="dungeon-set-btn" id="pvp-clock-set-btn">Set</button>
        </span>
        <button id="pvp-reset-btn" style="padding:5px 14px;background:#3a1a1a;border:1px solid #6a2a2a;color:#e96a6a;border-radius:4px;cursor:pointer;font-family:monospace;font-size:0.82rem;">Reset ↺</button>
      </div>
    </div>
  </div>

  <!-- Right panel: Activity Log -->
  <div id="right-panel">
    <div id="log-header">Activity Log</div>
    <div id="activity-log"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const MODULES = [
      { id: 'waiting',  label: 'Waiting' },
      { id: 'chat',     label: 'Chat' },
      { id: 'dungeon',  label: 'Dungeon' },
      { id: 'pvp',      label: 'PvP' },
      { id: 'module-a', label: 'Module A' },
      { id: 'module-b', label: 'Module B' },
    ];

    const MINIGAMES = [
      { id: 'minigame-reflex',   label: 'Reflex Test' },
      { id: 'minigame-reflex-2', label: 'Reflex Test Lv.2' },
      { id: 'minigame-reflex-3', label: 'Reflex Test Lv.3' },
    ];

    const socket = io();

    const statusEl        = document.getElementById('status');
    const playersEl       = document.getElementById('players');
    const noPlayersEl     = document.getElementById('no-players');
    const currentModuleEl = document.getElementById('current-module-name');
    const moduleGrid      = document.getElementById('module-grid');
    const dungeonWInput   = document.getElementById('dungeon-w');
    const dungeonHInput   = document.getElementById('dungeon-h');
    const dungeonSetBtn   = document.getElementById('dungeon-set-btn');
    const dungeonSizeLabel= document.getElementById('dungeon-size-label');
    const activityLog     = document.getElementById('activity-log');

    // Build module buttons
    MODULES.forEach(({ id, label }) => {
      const btn = document.createElement('button');
      btn.className = 'module-btn';
      btn.dataset.moduleId = id;
      btn.textContent = label;
      btn.addEventListener('click', () => socket.emit('host:push', id));
      moduleGrid.appendChild(btn);
    });

    // Populate send-all dropdown and wire button
    const sendAllSelect = document.getElementById('send-all-select');
    const sendAllBtn    = document.getElementById('send-all-btn');
    MINIGAMES.forEach(({ id, label }) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = label;
      sendAllSelect.appendChild(opt);
    });
    sendAllBtn.addEventListener('click', () => {
      socket.emit('host:send-minigame-all', { minigame: sendAllSelect.value });
    });

    dungeonSetBtn.addEventListener('click', () => {
      const width  = parseInt(dungeonWInput.value, 10);
      const height = parseInt(dungeonHInput.value, 10);
      if (!isNaN(width) && !isNaN(height)) {
        socket.emit('host:dungeon-resize', { width, height });
      }
    });

    // ── Dungeon mode buttons ──
    const dModeBtns = { free: document.getElementById('d-mode-free'), turn: document.getElementById('d-mode-turn'), clock: document.getElementById('d-mode-clock') };
    const dungeonTimerBtn    = document.getElementById('dungeon-timer-btn');
    const dungeonTimerSecs   = document.getElementById('dungeon-timer-secs');
    const dungeonTimerSetBtn = document.getElementById('dungeon-timer-set-btn');
    const dungeonClockSecs   = document.getElementById('dungeon-clock-secs');
    const dungeonClockSetBtn = document.getElementById('dungeon-clock-set-btn');
    const dTurnWrap  = document.getElementById('d-turn-timer-wrap');
    const dClockWrap = document.getElementById('d-clock-timer-wrap');

    Object.entries(dModeBtns).forEach(([mode, btn]) => {
      btn.addEventListener('click', () => socket.emit('host:dungeon-mode', mode));
    });
    dungeonTimerBtn.addEventListener('click', () => socket.emit('host:dungeon-timer-toggle'));
    dungeonTimerSetBtn.addEventListener('click', () => {
      const v = parseInt(dungeonTimerSecs.value, 10);
      if (!isNaN(v)) socket.emit('host:dungeon-timer-set', { turnSecs: v });
    });
    dungeonClockSetBtn.addEventListener('click', () => {
      const v = parseInt(dungeonClockSecs.value, 10);
      if (!isNaN(v)) socket.emit('host:dungeon-timer-set', { clockSecs: v });
    });
    document.getElementById('dungeon-reset-btn').addEventListener('click', () => socket.emit('host:dungeon-reset'));

    socket.on('dungeon:state', ({ mode, timerEnabled, timerSeconds, clockSeconds }) => {
      Object.entries(dModeBtns).forEach(([m, btn]) => btn.classList.toggle('on', m === mode));
      dTurnWrap.style.display  = mode === 'turn'  ? 'flex' : 'none';
      dClockWrap.style.display = mode === 'clock' ? 'flex' : 'none';
      dungeonTimerBtn.textContent = `Timer: ${timerEnabled ? 'ON' : 'OFF'}`;
      dungeonTimerBtn.classList.toggle('on', timerEnabled);
      if (timerSeconds != null) dungeonTimerSecs.value = timerSeconds;
      if (clockSeconds != null) dungeonClockSecs.value = clockSeconds;
    });

    // ── PvP mode buttons ──
    const pModeBtns = { free: document.getElementById('p-mode-free'), turn: document.getElementById('p-mode-turn'), clock: document.getElementById('p-mode-clock') };
    const pvpTimerBtn    = document.getElementById('pvp-timer-btn');
    const pvpTimerSecs   = document.getElementById('pvp-timer-secs');
    const pvpTimerSetBtn = document.getElementById('pvp-timer-set-btn');
    const pvpClockSecs   = document.getElementById('pvp-clock-secs');
    const pvpClockSetBtn = document.getElementById('pvp-clock-set-btn');
    const pTurnWrap  = document.getElementById('p-turn-timer-wrap');
    const pClockWrap = document.getElementById('p-clock-timer-wrap');

    Object.entries(pModeBtns).forEach(([mode, btn]) => {
      btn.addEventListener('click', () => socket.emit('host:pvp-mode', mode));
    });
    pvpTimerBtn.addEventListener('click', () => socket.emit('host:pvp-timer-toggle'));
    pvpTimerSetBtn.addEventListener('click', () => {
      const v = parseInt(pvpTimerSecs.value, 10);
      if (!isNaN(v)) socket.emit('host:pvp-timer-set', { turnSecs: v });
    });
    pvpClockSetBtn.addEventListener('click', () => {
      const v = parseInt(pvpClockSecs.value, 10);
      if (!isNaN(v)) socket.emit('host:pvp-timer-set', { clockSecs: v });
    });
    document.getElementById('pvp-reset-btn').addEventListener('click', () => socket.emit('host:pvp-reset'));

    socket.on('pvp:state', ({ mode, timerEnabled, timerSeconds, clockSeconds }) => {
      Object.entries(pModeBtns).forEach(([m, btn]) => btn.classList.toggle('on', m === mode));
      pTurnWrap.style.display  = mode === 'turn'  ? 'flex' : 'none';
      pClockWrap.style.display = mode === 'clock' ? 'flex' : 'none';
      pvpTimerBtn.textContent = `Timer: ${timerEnabled ? 'ON' : 'OFF'}`;
      pvpTimerBtn.classList.toggle('on', timerEnabled);
      if (timerSeconds != null) pvpTimerSecs.value = timerSeconds;
      if (clockSeconds != null) pvpClockSecs.value = clockSeconds;
    });

    const CLASSES = [
      { id: 'barbarian', label: 'Barbarian', color: '#e96a6a' },
      { id: 'wizard',    label: 'Wizard',    color: '#4a9de0' },
      { id: 'healer',    label: 'Healer',    color: '#f5d442' },
    ];

    // ── Player list with send-minigame ──
    function buildPlayerList(players) {
      playersEl.innerHTML = '';
      if (players.length === 0) {
        noPlayersEl.style.display = 'block';
        return;
      }
      noPlayersEl.style.display = 'none';
      players.forEach(({ name, socketId, playerClass }) => {
        const li = document.createElement('li');

        const nameEl = document.createElement('span');
        nameEl.className = 'player-name';
        nameEl.textContent = name;

        const classSel = document.createElement('select');
        classSel.className = 'minigame-select';
        CLASSES.forEach(({ id, label }) => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = label;
          if (id === (playerClass || 'barbarian')) opt.selected = true;
          classSel.appendChild(opt);
        });
        classSel.addEventListener('change', () => {
          socket.emit('host:set-class', { socketId, playerClass: classSel.value });
          const cls = CLASSES.find(c => c.id === classSel.value);
          if (cls) classSel.style.color = cls.color;
        });
        // Set initial color
        const initCls = CLASSES.find(c => c.id === (playerClass || 'barbarian'));
        if (initCls) classSel.style.color = initCls.color;

        const minigameSel = document.createElement('select');
        minigameSel.className = 'minigame-select';
        MINIGAMES.forEach(({ id, label }) => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = label;
          minigameSel.appendChild(opt);
        });

        const sendBtn = document.createElement('button');
        sendBtn.className = 'send-btn';
        sendBtn.textContent = 'Send ↑';
        sendBtn.addEventListener('click', () => {
          socket.emit('host:send-minigame', { socketId, minigame: minigameSel.value });
        });

        li.appendChild(nameEl);
        li.appendChild(classSel);
        li.appendChild(minigameSel);
        li.appendChild(sendBtn);
        playersEl.appendChild(li);
      });
    }

    // ── Activity log ──
    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function renderLog(entries) {
      activityLog.innerHTML = '';
      entries.forEach(({ ts, message, type }) => {
        const row = document.createElement('div');
        row.className = `log-entry ${type}`;

        const timeEl = document.createElement('span');
        timeEl.className = 'log-time';
        timeEl.textContent = formatTime(ts);

        const msgEl = document.createElement('span');
        msgEl.className = 'log-msg';
        msgEl.textContent = message;

        row.appendChild(timeEl);
        row.appendChild(msgEl);
        activityLog.appendChild(row);
      });
      activityLog.scrollTop = activityLog.scrollHeight;
    }

    // ── Socket events ──
    socket.on('connect', () => {
      statusEl.textContent = 'connected';
      statusEl.className = 'connected';
      socket.emit('host:request-state');
    });

    socket.on('disconnect', () => {
      statusEl.textContent = 'disconnected';
      statusEl.className = 'disconnected';
    });

    socket.on('host:state-update', ({ players, currentModule, dungeon }) => {
      buildPlayerList(players);

      currentModuleEl.textContent = currentModule;
      document.querySelectorAll('.module-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.moduleId === currentModule);
      });

      document.getElementById('dungeon-section').style.display = currentModule === 'dungeon' ? '' : 'none';
      document.getElementById('pvp-section').style.display     = currentModule === 'pvp'     ? '' : 'none';

      if (dungeon) {
        dungeonWInput.value = dungeon.width;
        dungeonHInput.value = dungeon.height;
        dungeonSizeLabel.textContent = `${dungeon.width}×${dungeon.height}`;
      }
    });

    socket.on('host:log-update', (entries) => {
      renderLog(entries);
    });
  </script>
</body>
</html>
