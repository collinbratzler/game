<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--bg, #0d0d1a);
      color: var(--fg, #eee);
      transition: background 0.4s, color 0.4s;
    }

    body.theme-dungeon { --bg: #0d0d1a; --fg: #eee; --cell-bg: #14142a; --cell-void: transparent; --legend-color: #666; --title-color: #444; --dim-color: #333; --flash-default: #ff5c5c; }
    body.theme-arena   { --bg: #b89a5a; --fg: #4a3010; --cell-bg: #dcc890; --cell-void: transparent; --legend-color: #7a5a20; --title-color: #7a5a20; --dim-color: #7a5a20; --flash-default: #e96a6a; }

    /* ── Lobby overlay ── */
    #lobby {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: #0d0d1a;
      z-index: 10;
    }
    #lobby-title {
      font-size: 2.2rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #4a9de0;
    }
    #lobby-config {
      display: flex;
      gap: 24px;
      align-items: flex-end;
    }
    .lobby-field { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .lobby-field label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #444;
    }
    .lobby-field input {
      width: 72px;
      padding: 8px 6px;
      background: #141428;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #eee;
      font-family: monospace;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
    }
    .lobby-field input:focus { outline: none; border-color: #4a9de0; }

    #lobby-start-btn {
      padding: 12px 28px;
      background: #132213;
      border: 1px solid #2e7d32;
      color: #4caf50;
      border-radius: 8px;
      cursor: pointer;
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      transition: background 0.15s;
      align-self: flex-end;
    }
    #lobby-start-btn:hover { background: #1a3a1a; }
    #lobby-start-btn:active { transform: scale(0.97); }

    #lobby-players {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 340px;
    }
    #lobby-players-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #333;
      margin-bottom: 2px;
    }
    .lobby-player {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #141428;
      border: 1px solid #1e1e38;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .lobby-player.ready { border-color: #2e7d32; background: #0d1a0d; }
    .lobby-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .lobby-player-name { flex: 1; color: #aaa; }
    .lobby-player.ready .lobby-player-name { color: #eee; }
    .lobby-status {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .lobby-status.ready    { background: #1a2e1a; color: #4caf50; }
    .lobby-status.not-ready { background: #1e1e1e; color: #444; }

    #lobby-empty {
      font-size: 0.75rem;
      color: #333;
      text-align: center;
      padding: 10px 0;
    }

    /* ── Game overlay ── */
    #header {
      position: absolute;
      top: 14px; left: 0; right: 0;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    #title    { font-size: 0.85rem; letter-spacing: 0.2em; color: var(--title-color); text-transform: uppercase; }
    #dim-label { font-size: 0.75rem; color: var(--dim-color); }

    #turn-banner {
      position: absolute;
      top: 14px; right: 20px;
      font-size: 0.78rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 4px 14px;
      border-radius: 20px; display: none;
    }
    body.theme-dungeon #turn-banner { background: #1e2a1e; color: #4caf7d; border: 1px solid #2a4a2a; }
    body.theme-arena   #turn-banner { background: #7a5a20; color: #ffeebb; border: 1px solid #a07840; }

    #mode-badge {
      position: absolute;
      top: 14px; left: 20px;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 3px 12px; border-radius: 20px; display: none;
    }
    #mode-badge.freeze { background: rgba(0,0,0,0.2); color: #888; }
    #mode-badge.free   { background: rgba(74,157,224,0.2); color: #4a9de0; }
    #mode-badge.turn   { background: rgba(76,175,125,0.2); color: #4caf7d; }
    #mode-badge.clock  { background: rgba(245,158,66,0.2); color: #f59e42; }

    #grid-wrap {
      display: flex; align-items: center; justify-content: center;
    }

    #arena-grid { display: grid; gap: 2px; }

    .cell {
      background: var(--cell-bg);
      border-radius: 3px;
      position: relative;
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center;
      gap: 1px;
    }
    .cell-wall { background: #555; border-radius: 3px; }
    body.theme-arena .cell-wall { background: #8a6030; }
    .cell-void { background: transparent; }

    .cell.attacked {
      animation: attack-flash 0.45s ease-out forwards;
    }
    @keyframes attack-flash {
      0%   { background: var(--flash-color, var(--flash-default)); box-shadow: 0 0 14px var(--flash-color, var(--flash-default)); }
      100% { background: var(--cell-bg); box-shadow: none; }
    }

    .token {
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    .enemy-token {
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff;
      background: #c0392b;
      box-shadow: 0 0 10px rgba(220,50,30,0.7);
      flex-shrink: 0;
    }

    #legend {
      position: absolute;
      bottom: 14px; left: 0; right: 0;
      display: flex; gap: 16px;
      justify-content: center; flex-wrap: wrap;
      padding: 0 20px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--legend-color); }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; }

    /* Player color palette */
    .pc-0 { background: #e96a6a; }
    .pc-1 { background: #f59e42; }
    .pc-2 { background: #4caf7d; }
    .pc-3 { background: #4a9de0; }
    .pc-4 { background: #9b8afb; }
    .pc-5 { background: #f06292; }
    .pc-6 { background: #26c6da; }
    .pc-7 { background: #a3c85a; }

    #empty-msg { font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--legend-color); }
  </style>
</head>
<body class="theme-dungeon">

  <!-- Lobby overlay (shown during setup mode) -->
  <div id="lobby">
    <div id="lobby-title">Arena</div>
    <div id="lobby-config">
      <div class="lobby-field">
        <label>Width</label>
        <input id="lobby-w" type="number" min="4" max="30" value="10" />
      </div>
      <div class="lobby-field">
        <label>Height</label>
        <input id="lobby-h" type="number" min="4" max="30" value="8" />
      </div>
      <div class="lobby-field">
        <label>Enemies</label>
        <input id="lobby-enemies" type="number" min="0" max="20" value="3" />
      </div>
      <button id="lobby-start-btn">Start →</button>
    </div>
    <div id="lobby-players">
      <div id="lobby-players-label">Players</div>
      <div id="lobby-player-list"></div>
      <div id="lobby-empty">No players connected.</div>
    </div>
  </div>

  <!-- Game view -->
  <div id="header">
    <span id="title">Arena</span>
    <span id="dim-label"></span>
  </div>
  <div id="mode-badge"></div>
  <div id="turn-banner"></div>

  <div id="grid-wrap">
    <div id="arena-grid"></div>
    <div id="empty-msg">Waiting for players…</div>
  </div>

  <div id="legend"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket     = io();
    const gridEl     = document.getElementById('arena-grid');
    const emptyMsg   = document.getElementById('empty-msg');
    const legendEl   = document.getElementById('legend');
    const dimLabel   = document.getElementById('dim-label');
    const turnBanner = document.getElementById('turn-banner');
    const modeBadge  = document.getElementById('mode-badge');
    const lobbyEl        = document.getElementById('lobby');
    const lobbyWEl       = document.getElementById('lobby-w');
    const lobbyHEl       = document.getElementById('lobby-h');
    const lobbyEEl       = document.getElementById('lobby-enemies');
    const lobbyListEl    = document.getElementById('lobby-player-list');
    const lobbyEmptyEl   = document.getElementById('lobby-empty');
    const lobbyStartBtn  = document.getElementById('lobby-start-btn');

    const COLORS = ['#e96a6a','#f59e42','#4caf7d','#4a9de0','#9b8afb','#f06292','#26c6da','#a3c85a'];

    let currentState = null;
    let cells        = [];

    // ── Start button ─────────────────────────────────────────────────
    lobbyStartBtn.addEventListener('click', () => {
      const w = parseInt(lobbyWEl.value, 10);
      const h = parseInt(lobbyHEl.value, 10);
      const e = parseInt(lobbyEEl.value, 10);
      if (!isNaN(w) && !isNaN(h) && !isNaN(e)) {
        socket.emit('host:arena-start', { width: w, height: h, enemyCount: e });
      }
    });

    // ── Lobby ────────────────────────────────────────────────────────
    function renderLobby(state) {
      lobbyEl.style.display = 'flex';

      const { lobbyPlayers } = state;
      const players = lobbyPlayers || [];

      lobbyListEl.innerHTML = '';
      lobbyEmptyEl.style.display = players.length === 0 ? 'block' : 'none';

      players.forEach(({ name, colorIndex, charSelectDone }) => {
        const el = document.createElement('div');
        el.className = 'lobby-player' + (charSelectDone ? ' ready' : '');

        const dot = document.createElement('div');
        dot.className = 'lobby-dot';
        dot.style.background = COLORS[colorIndex] || '#555';

        const nameEl = document.createElement('span');
        nameEl.className = 'lobby-player-name';
        nameEl.textContent = name;

        const statusEl = document.createElement('span');
        statusEl.className = 'lobby-status ' + (charSelectDone ? 'ready' : 'not-ready');
        statusEl.textContent = charSelectDone ? 'Ready' : 'Not ready';

        el.appendChild(dot);
        el.appendChild(nameEl);
        el.appendChild(statusEl);
        lobbyListEl.appendChild(el);
      });
    }

    // ── Grid building ────────────────────────────────────────────────
    function cellSize(cols, rows) {
      const maxW = (window.innerWidth  - 32) / cols;
      const maxH = (window.innerHeight - 80) / rows;
      return Math.max(14, Math.floor(Math.min(maxW, maxH, 72)));
    }

    function buildGrid(grid) {
      const rows = grid.length;
      const cols = grid[0] ? grid[0].length : 0;
      const sz   = cellSize(cols, rows);

      gridEl.style.gridTemplateColumns = `repeat(${cols}, ${sz}px)`;
      gridEl.style.gridTemplateRows    = `repeat(${rows}, ${sz}px)`;
      gridEl.innerHTML = '';
      cells = [];

      for (let y = 0; y < rows; y++) {
        cells[y] = [];
        for (let x = 0; x < cols; x++) {
          const div = document.createElement('div');
          const val = grid[y][x];
          if (val === 0) {
            div.className = 'cell-void';
            cells[y][x]   = null;
          } else if (val === 2) {
            div.className    = 'cell-wall';
            div.style.width  = `${sz}px`;
            div.style.height = `${sz}px`;
            cells[y][x]      = div;
          } else {
            div.className    = 'cell';
            div.dataset.x    = x;
            div.dataset.y    = y;
            div.style.width  = `${sz}px`;
            div.style.height = `${sz}px`;
            cells[y][x]      = div;
          }
          gridEl.appendChild(div);
        }
      }

      const cols2 = grid[0]?.length ?? 0;
      dimLabel.textContent = `${cols2} × ${rows}`;
    }

    // ── Rendering ────────────────────────────────────────────────────
    function renderState(state) {
      if (state.mode === 'setup') {
        renderLobby(state);
        return;
      }

      lobbyEl.style.display = 'none';

      const { grid } = state;
      if (!grid) return;

      const needRebuild = !currentState
        || JSON.stringify(currentState.grid) !== JSON.stringify(grid);

      if (needRebuild) buildGrid(grid);
      currentState = state;

      document.body.className = 'theme-dungeon';

      // Clear all tokens
      cells.forEach(row => row?.forEach(cell => { if (cell?.classList.contains('cell')) cell.innerHTML = ''; }));

      // Group tokens by cell
      const byCell = {};
      state.players.forEach(p => {
        const k = `${p.x},${p.y}`;
        if (!byCell[k]) byCell[k] = { players: [], enemyCount: 0 };
        byCell[k].players.push(p);
      });
      (state.enemies || []).forEach(enemy => {
        const k = `${enemy.x},${enemy.y}`;
        if (!byCell[k]) byCell[k] = { players: [], enemyCount: 0 };
        byCell[k].enemyCount++;
      });

      Object.entries(byCell).forEach(([key, { players: cellPlayers, enemyCount }]) => {
        const [x, y] = key.split(',').map(Number);
        const cell   = cells[y]?.[x];
        if (!cell?.classList.contains('cell')) return;

        const n     = cellPlayers.length + enemyCount;
        const pct   = n === 1 ? 68 : n <= 4 ? 42 : 27;
        const fSize = n === 1 ? '0.65em' : n <= 4 ? '0.42em' : '0.28em';

        cellPlayers.forEach(({ name, colorIndex }) => {
          const t = document.createElement('div');
          t.className   = `token pc-${colorIndex}`;
          t.style.width = t.style.height = `${pct}%`;
          t.style.fontSize = fSize;
          t.textContent    = name.charAt(0).toUpperCase();
          cell.appendChild(t);
        });

        for (let e = 0; e < enemyCount; e++) {
          const t = document.createElement('div');
          t.className   = 'enemy-token';
          t.style.width = t.style.height = `${pct}%`;
          t.style.fontSize = fSize;
          t.textContent    = '☠';
          cell.appendChild(t);
        }
      });

      // Legend
      legendEl.innerHTML = '';
      state.players.forEach(({ name, colorIndex }) => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        const dot = document.createElement('div');
        dot.className = `legend-dot pc-${colorIndex}`;
        const label = document.createElement('span');
        label.textContent = name;
        item.appendChild(dot); item.appendChild(label);
        legendEl.appendChild(item);
      });

      // Turn banner
      if (state.mode === 'turn' && state.currentTurn) {
        turnBanner.textContent   = `${state.currentTurn}'s turn`;
        turnBanner.style.display = 'block';
      } else {
        turnBanner.style.display = 'none';
      }

      // Mode badge
      const modeLabels = { freeze:'Freeze', free:'Free', turn:'Turns', clock:'Clock' };
      modeBadge.textContent   = modeLabels[state.mode] || state.mode;
      modeBadge.className     = state.mode;
      modeBadge.style.display = 'block';

      const titleEl = document.getElementById('title');
      titleEl.textContent = state.pvp ? 'PvP Arena' : (state.enemies?.length > 0 ? 'Dungeon' : 'Arena');

      emptyMsg.style.display = state.players.length === 0 ? 'block' : 'none';
      gridEl.style.display   = state.players.length === 0 ? 'none'  : 'grid';
    }

    // ── Flash ─────────────────────────────────────────────────────────
    function flashCell(x, y, color) {
      const cell = cells[y]?.[x];
      if (!cell?.classList.contains('cell')) return;
      cell.style.setProperty('--flash-color', color);
      cell.classList.remove('attacked');
      void cell.offsetWidth;
      cell.classList.add('attacked');
      cell.addEventListener('animationend', () => cell.classList.remove('attacked'), { once: true });
    }

    // ── Socket ────────────────────────────────────────────────────────
    socket.on('connect', () => socket.emit('arena:request-state'));
    socket.on('arena:state',       state  => renderState(state));
    socket.on('arena:area-attack', ({ positions, color }) => positions.forEach(({ x, y }) => flashCell(x, y, color)));

    window.addEventListener('resize', () => {
      if (currentState && currentState.mode !== 'setup') buildGrid(currentState.grid);
    });
  </script>
</body>
</html>
