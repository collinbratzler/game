<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reflex Test</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f7f6f3;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px max(32px, env(safe-area-inset-bottom));
      user-select: none;
      gap: 28px;
    }

    #title {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #bbb;
    }

    #instruction {
      font-size: 1rem;
      color: #888;
      text-align: center;
      line-height: 1.5;
      min-height: 1.5em;
      transition: opacity 0.2s;
    }

    /* The big reaction button */
    #react-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      touch-action: manipulation;
      transition: background 0.08s, transform 0.08s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      line-height: 1.3;
    }

    /* States */
    #react-btn.idle {
      background: #1a1a1a;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    #react-btn.idle:active { transform: scale(0.96); }

    #react-btn.waiting {
      background: #ccc;
      color: #999;
      cursor: default;
      box-shadow: none;
    }

    #react-btn.go {
      background: #4caf7d;
      box-shadow: 0 0 48px rgba(76, 175, 125, 0.5), 0 8px 32px rgba(76, 175, 125, 0.3);
      animation: pulse-go 0.4s ease-out;
    }
    #react-btn.go:active { transform: scale(0.96); }

    #react-btn.fail {
      background: #e96a6a;
      box-shadow: 0 0 48px rgba(233, 106, 106, 0.4);
      cursor: default;
    }

    #react-btn.success {
      background: #4a9de0;
      box-shadow: 0 0 48px rgba(74, 157, 224, 0.4);
      cursor: default;
    }

    @keyframes pulse-go {
      0%   { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    #result-label {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      min-height: 2.5rem;
      color: #1a1a1a;
    }
    #result-label.good { color: #4a9de0; }
    #result-label.bad  { color: #e96a6a; }
  </style>
</head>
<body>

  <div id="title">Reflex Test</div>
  <div id="instruction">Tap the button to start</div>
  <button id="react-btn" class="idle">Start</button>
  <div id="result-label"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const playerName = new URLSearchParams(location.search).get('name') || 'Unknown';
    const socket = io();

    const btn         = document.getElementById('react-btn');
    const instruction = document.getElementById('instruction');
    const resultLabel = document.getElementById('result-label');

    // State machine: idle → waiting → go → done
    let phase = 'idle';
    let changeTime = null;
    let waitTimer  = null;
    let timeoutTimer = null;

    function setPhase(p) {
      phase = p;

      btn.className = ({
        idle:    'idle',
        waiting: 'waiting',
        go:      'go',
        done:    'done',
      }[p] || 'idle');

      if (p === 'idle') {
        btn.textContent = 'Start';
        instruction.textContent = 'Tap the button to start';
        resultLabel.textContent = '';
        resultLabel.className = '';
      } else if (p === 'waiting') {
        btn.textContent = 'Wait…';
        instruction.textContent = 'Tap when the button turns green';
      } else if (p === 'go') {
        btn.textContent = 'NOW!';
        instruction.textContent = '';
      }
    }

    function startWaiting() {
      setPhase('waiting');
      const delay = 1500 + Math.random() * 3000; // 1.5s – 4.5s
      waitTimer = setTimeout(() => {
        changeTime = Date.now();
        setPhase('go');
        // Timeout if they don't click within 3s
        timeoutTimer = setTimeout(() => finish({ timeout: true }), 3000);
      }, delay);
    }

    function finish(result) {
      clearTimeout(waitTimer);
      clearTimeout(timeoutTimer);
      setPhase('done');

      if (result.fail) {
        btn.className = 'fail';
        btn.textContent = 'False Start';
        resultLabel.textContent = 'FALSE START';
        resultLabel.className = 'bad';
        instruction.textContent = 'You clicked too early';
      } else if (result.timeout) {
        btn.className = 'fail';
        btn.textContent = 'Too slow';
        resultLabel.textContent = 'TIMEOUT';
        resultLabel.className = 'bad';
        instruction.textContent = 'No response in time';
      } else {
        btn.className = 'success';
        btn.textContent = `${result.time}ms`;
        resultLabel.textContent = `${result.time}ms`;
        resultLabel.className = 'good';
        instruction.textContent = 'Nice!';
      }

      socket.emit('minigame:complete', { name: playerName, game: 'Reflex', result });

      // Brief pause so they can see their result, then idle for potential retry
      setTimeout(() => setPhase('idle'), 2500);
    }

    btn.addEventListener('click', () => {
      if (phase === 'idle')    { startWaiting(); return; }
      if (phase === 'waiting') { finish({ fail: true }); return; }
      if (phase === 'go')      { finish({ time: Date.now() - changeTime }); return; }
    });

    setPhase('idle');
  </script>
</body>
</html>
