<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f7f6f3;
      color: #1a1a1a;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    #header {
      padding: 14px 20px 12px;
      border-bottom: 1px solid #e8e6e1;
      background: #fff;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    #header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.01em;
    }
    #header .you-badge {
      font-size: 0.72rem;
      font-weight: 500;
      color: #9b8afb;
      background: #f0eeff;
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* Message history */
    #history {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .msg {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 3px 0;
      line-height: 1.5;
    }

    .msg-name {
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .msg-text {
      font-size: 0.92rem;
      color: #37352f;
      word-break: break-word;
    }

    .msg-time {
      font-size: 0.68rem;
      color: #c4c0b8;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: auto;
    }

    /* Color palette for names — cycles by index */
    .color-0 { color: #e96a6a; }
    .color-1 { color: #f59e42; }
    .color-2 { color: #4caf7d; }
    .color-3 { color: #4a9de0; }
    .color-4 { color: #9b8afb; }
    .color-5 { color: #f06292; }
    .color-6 { color: #26c6da; }
    .color-7 { color: #a3c85a; }

    /* Divider between bursts */
    .msg-group-gap { margin-top: 8px; }

    /* Input area */
    #input-area {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid #e8e6e1;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #msg-input {
      flex: 1;
      font-family: 'Inter', sans-serif;
      font-size: 1rem; /* 16px — prevents iOS auto-zoom */
      background: #f7f6f3;
      border: 1.5px solid #e8e6e1;
      border-radius: 8px;
      padding: 10px 12px;
      color: #1a1a1a;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
    }
    #msg-input:focus { border-color: #9b8afb; }
    #msg-input::placeholder { color: #b8b4ac; }

    #send-btn {
      background: #9b8afb;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0 18px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 44px; /* touch target minimum */
      touch-action: manipulation; /* prevents 300ms tap delay */
    }
    #send-btn:hover { background: #8370f7; }
    #send-btn:active { background: #7260e8; }
    #send-btn:disabled { background: #d4cef8; cursor: default; }

    /* Empty state */
    #empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c4c0b8;
      font-size: 0.85rem;
    }

    /* Scrollbar */
    #history::-webkit-scrollbar { width: 4px; }
    #history::-webkit-scrollbar-track { background: transparent; }
    #history::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
  </style>
</head>
<body>

  <div id="header">
    <h1>Chat</h1>
    <span class="you-badge" id="you-badge"></span>
  </div>

  <div id="history">
    <div id="empty">No messages yet.</div>
  </div>

  <div id="input-area">
    <textarea id="msg-input" placeholder="Say something..." rows="1"></textarea>
    <button id="send-btn" disabled>Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const playerName = new URLSearchParams(location.search).get('name') || 'Anonymous';

    document.getElementById('you-badge').textContent = playerName;

    const socket = io();
    const historyEl = document.getElementById('history');
    const emptyEl = document.getElementById('empty');
    const inputEl = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');

    // Assign a consistent color to each name we've seen
    const nameColors = {};
    let colorCounter = 0;
    function colorFor(name) {
      if (!(name in nameColors)) {
        nameColors[name] = colorCounter++ % 8;
      }
      return `color-${nameColors[name]}`;
    }

    let lastSender = null;

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage({ name, text, ts }, isHistory = false) {
      if (emptyEl.parentNode) emptyEl.remove();

      const row = document.createElement('div');
      row.className = 'msg';
      if (!isHistory && lastSender !== name) row.classList.add('msg-group-gap');

      const nameEl = document.createElement('span');
      nameEl.className = `msg-name ${colorFor(name)}`;
      nameEl.textContent = name;

      const textEl = document.createElement('span');
      textEl.className = 'msg-text';
      textEl.textContent = text;

      const timeEl = document.createElement('span');
      timeEl.className = 'msg-time';
      timeEl.textContent = formatTime(ts);

      row.appendChild(nameEl);
      row.appendChild(textEl);
      row.appendChild(timeEl);
      historyEl.appendChild(row);

      lastSender = name;
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      socket.emit('chat:message', { name: playerName, text });
      inputEl.value = '';
      inputEl.style.height = 'auto';
    }

    sendBtn.addEventListener('click', send);

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = inputEl.scrollHeight + 'px';
    });

    socket.on('connect', () => {
      sendBtn.disabled = false;
      socket.emit('chat:request-history');
    });

    socket.on('disconnect', () => {
      sendBtn.disabled = true;
    });

    socket.on('chat:history', (messages) => {
      historyEl.innerHTML = '';
      lastSender = null;
      messages.forEach(msg => appendMessage(msg, true));
      if (messages.length === 0) historyEl.appendChild(emptyEl);
    });

    socket.on('chat:message', (msg) => {
      appendMessage(msg);
    });
  </script>
</body>
</html>
