<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f7f6f3;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #header {
      padding: 16px 24px 14px;
      border-bottom: 1px solid #e8e6e1;
      background: #fff;
    }
    #header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.01em;
    }

    #history {
      flex: 1;
      overflow-y: auto;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .msg {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 4px 0;
      line-height: 1.5;
    }
    .msg-group-gap { margin-top: 10px; }

    .msg-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .msg-text {
      font-size: 1.05rem;
      color: #37352f;
      word-break: break-word;
    }

    .msg-time {
      font-size: 0.75rem;
      color: #c4c0b8;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: auto;
    }

    .color-0 { color: #e96a6a; }
    .color-1 { color: #f59e42; }
    .color-2 { color: #4caf7d; }
    .color-3 { color: #4a9de0; }
    .color-4 { color: #9b8afb; }
    .color-5 { color: #f06292; }
    .color-6 { color: #26c6da; }
    .color-7 { color: #a3c85a; }

    #empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c4c0b8;
      font-size: 0.9rem;
    }

    #history::-webkit-scrollbar { width: 4px; }
    #history::-webkit-scrollbar-track { background: transparent; }
    #history::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
  </style>
</head>
<body>

  <div id="header"><h1>Chat</h1></div>
  <div id="history">
    <div id="empty">No messages yet.</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const historyEl = document.getElementById('history');
    const emptyEl   = document.getElementById('empty');

    const nameColors = {};
    let colorCounter = 0;
    let lastSender = null;

    function colorFor(name) {
      if (!(name in nameColors)) nameColors[name] = colorCounter++ % 8;
      return `color-${nameColors[name]}`;
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage({ name, text, ts }, isHistory = false) {
      if (emptyEl.parentNode) emptyEl.remove();

      const row = document.createElement('div');
      row.className = 'msg';
      if (!isHistory && lastSender !== name) row.classList.add('msg-group-gap');

      const nameEl = document.createElement('span');
      nameEl.className = `msg-name ${colorFor(name)}`;
      nameEl.textContent = name;

      const textEl = document.createElement('span');
      textEl.className = 'msg-text';
      textEl.textContent = text;

      const timeEl = document.createElement('span');
      timeEl.className = 'msg-time';
      timeEl.textContent = formatTime(ts);

      row.appendChild(nameEl);
      row.appendChild(textEl);
      row.appendChild(timeEl);
      historyEl.appendChild(row);

      lastSender = name;
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    socket.on('connect', () => {
      socket.emit('chat:request-history');
    });

    socket.on('chat:history', (messages) => {
      historyEl.innerHTML = '';
      lastSender = null;
      messages.forEach(msg => appendMessage(msg, true));
      if (messages.length === 0) historyEl.appendChild(emptyEl);
    });

    socket.on('chat:message', (msg) => {
      appendMessage(msg);
    });
  </script>
</body>
</html>
